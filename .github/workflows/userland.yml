name: userland

# iOS arm64 userland in one workflow:
#   helpers    userland/src/NAME.c -> an ad-hoc signed vince-NAME (artifact "userland-bin")
#   gpu-stack  Mesa 25.0.7 (freedreno + softpipe) -> libOSMesa, eagl_gen.h -> libdaisy-gl,
#              the GPU injectors, and the hakios-metal A5xx stack. Artifact "gpu-stack" is
#              ready to copy to /daisy/lib (and bbd_wrap to /usr/libexec/backboardd).
on:
  workflow_dispatch:
  push:
    branches: [main, daisy-boot]
    paths:
      - "userland/**"
      - ".github/workflows/userland.yml"

concurrency:
  group: userland-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helpers:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p out
          for f in userland/src/*.c; do
            n=$(basename "$f" .c)
            n=${n%_stub}
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" -O2 -fblocks \
              -framework CoreFoundation -Wall -o "out/vince-$n" "$f"
            codesign -f -s - --entitlements userland/ent.plist "out/vince-$n"
            file "out/vince-$n"
            ls -la "out/vince-$n"
          done
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: userland-bin
          path: out/

  gpu-stack:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -e
          brew install bison meson ninja
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          meson --version
          ninja --version

      - name: Build Mesa (freedreno + softpipe)
        run: |
          set -e
          cd userland/mesa
          PREFIX=/daisy ./mk-mesa-mac.sh

      - name: Build eagl + GPU helpers
        run: |
          set -e
          cd userland/gpu
          CC="$(xcrun --sdk iphoneos -f clang)"
          make eagl_gen.h MESA_OUT=../mesa/build-mesa/out
          make out/libdaisy-gl.dylib MESA_OUT=../mesa/build-mesa/out CC="$CC"
          make out/bbd_wrap out/libdaisy-inject.dylib CC="$CC"
          make out/libtopaz-inject.dylib CC="$CC"

      - name: Build the a5xx Metal stack (hakios-metal a5xx-port, with the phone's own compiler)
        run: |
          set -e
          # Pinned a5xx-port revision: device-aware CA pipelines and A5xx 2D refusals.
          git init -q /tmp/hakios-metal
          git -C /tmp/hakios-metal fetch --depth 1 https://github.com/proxer05/hakios-metal c2c6b31463ffe8699b980de114e1ccf4afec3fa5
          git -C /tmp/hakios-metal checkout -q FETCH_HEAD
          cd /tmp/hakios-metal
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_MESA_ROOT="$GITHUB_WORKSPACE/userland/mesa/build-mesa" \
            make out/ios/libhakios-metal.a MESA=1 \
            IOS_CXX="xcrun clang++ -arch arm64 -isysroot $SDK -miphoneos-version-min=16.0" \
            IOS_CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror -Wno-invalid-constexpr" \
            IOS_AR="ar rcs"
          cd "$GITHUB_WORKSPACE/userland/gpu"
          METAL_LIBS="$(make -s -C /tmp/hakios-metal print-ios-libs MESA=1 IOS_MESA_ROOT="$GITHUB_WORKSPACE/userland/mesa/build-mesa")"
          make out/libmetal-smoke.dylib CC="$(xcrun --sdk iphoneos -f clang)" HAKIOS_METAL_OUT=/tmp/hakios-metal/out/ios HAKIOS_METAL_LIBS="$METAL_LIBS"
          nm -gU out/libmetal-smoke.dylib | grep ' _daisy_metal_smoke$'
          nm out/libmetal-smoke.dylib | grep ' _air_to_nir$'
          nm out/libmetal-smoke.dylib | grep ' _ir3_compile_shader_nir$'

      - name: Build the CoreAnimation Metal plug-in and stage shader tools
        run: |
          set -e
          CA_REF=96ffbc532e970f3540885755d457e401e04d4707
          git init -q /tmp/hakios-metalca
          git -C /tmp/hakios-metalca fetch --depth 1 https://github.com/oosexgang/hakios-xnu-kernel "$CA_REF"
          git -C /tmp/hakios-metalca checkout -q FETCH_HEAD
          patch --fuzz=0 -d /tmp/hakios-metalca -p1 < userland/gpu/metalca-a5xx.patch
          METAL_LIBS="$(make -s -C /tmp/hakios-metal print-ios-libs MESA=1 IOS_MESA_ROOT="$GITHUB_WORKSPACE/userland/mesa/build-mesa")"
          make -C userland/gpu out/HakiosMetal CC="$(xcrun --sdk iphoneos -f clang)" \
            HAKIOS_METAL_CA=/tmp/hakios-metalca HAKIOS_METAL_OUT=/tmp/hakios-metal/out/ios HAKIOS_METAL_LIBS="$METAL_LIBS"
          nm userland/gpu/out/HakiosMetal | grep ' _hakios_metal_program_new_bitcode_constants_on_device$'
          nm userland/gpu/out/HakiosMetal | grep ' _air_to_nir$'
          mkdir -p out/gpu/HakiosMetal.bundle out/gpu/metalca
          cp userland/gpu/out/HakiosMetal out/gpu/HakiosMetal.bundle/
          cp /tmp/hakios-metalca/userland/src/HakiosMetal.plist out/gpu/HakiosMetal.bundle/Info.plist
          codesign -f -s - out/gpu/HakiosMetal.bundle
          codesign --verify out/gpu/HakiosMetal.bundle
          cp /tmp/hakios-metalca/tools/merge_metallib.py userland/gpu/metalca_assets.py out/gpu/metalca/
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('ca_metallib', '/tmp/hakios-metalca/tools/ca-metallib.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path('out/gpu/metalca/QuartzCore-air64.metallib').write_bytes(module.air64_slice(module.MAC_QC))
          PY
          git -C /tmp/hakios-metal rev-parse HEAD > out/gpu/metalca/HAKIOS_METAL_COMMIT
          printf '%s\n' "$CA_REF" > out/gpu/metalca/HAKIOS_CA_COMMIT

      - name: Sign and stage
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          codesign -f -s - userland/mesa/build-mesa/out/libOSMesa.8.dylib
          mkdir -p out/gpu
          cp userland/mesa/build-mesa/out/libOSMesa.8.dylib out/gpu/
          cp userland/gpu/out/libdaisy-gl.dylib out/gpu/
          cp userland/gpu/out/libdaisy-inject.dylib out/gpu/
          cp userland/gpu/out/libtopaz-inject.dylib out/gpu/
          cp /tmp/hakios-metal/out/ios/libhakios-metal.a out/gpu/
          cp userland/gpu/out/libmetal-smoke.dylib out/gpu/
          cp userland/gpu/out/bbd_wrap out/gpu/
          cp userland/gpu/eagl_gen.h out/gpu/
          (cd out/gpu && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} \; > SHA256SUMS)
          file out/gpu/*
          ls -l out/gpu

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-build-logs
          path: |
            userland/mesa/build-mesa/meson-setup.log
            userland/mesa/build-mesa/ninja.log
            userland/gpu/eagl_gen.h
          if-no-files-found: ignore

      - name: Upload GPU stack
        uses: actions/upload-artifact@v4
        with:
          name: gpu-stack
          path: out/gpu/
          if-no-files-found: error
